appId: com.monitour.agent
productName: Monitour Agent
copyright: Copyright © 2025 Monitour

# Native modules (node-pty, libnut) ship prebuilt binaries — skip recompilation
npmRebuild: false

# Unpack native binaries from asar so they can be loaded/spawned at runtime
asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/node_modules/node-pty/**/*.exe"
  - "**/node_modules/node-pty/prebuilds/**"
  - "**/node_modules/node-pty/build/**"
  - "**/node_modules/koffi/build/**"
  - "**/node_modules/node-screenshots*/**"

directories:
  output: dist
  buildResources: build

# Production deps are auto-collected by electron-builder; `files` only
# controls app files and exclusions. Never add node_modules/** here — the
# hoisted root tree would drag in every workspace's dependencies.
files:
  - out/**
  - src/renderer/**
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.pdb"
  - "!**/node_modules/**/README*"
  - "!**/node_modules/**/CHANGELOG*"
  - "!**/node_modules/**/*.md"
  - "!**/node_modules/**/test/**"
  - "!**/node_modules/**/tests/**"
  - "!**/node_modules/**/docs/**"
  - "!**/node_modules/node-pty/src/**"
  - "!**/node_modules/node-pty/scripts/**"
  - "!**/node_modules/koffi/doc/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: System

nsis:
  oneClick: true
  perMachine: true
  allowToChangeInstallationDirectory: false
  runAfterFinish: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
