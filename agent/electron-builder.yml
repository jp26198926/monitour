appId: com.monitour.agent
productName: Monitour Agent
copyright: Copyright © 2025 Monitour

directories:
  output: dist
  buildResources: build

files:
  - dist/**
  - node_modules/**
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: System

nsis:
  oneClick: true
  perMachine: true
  allowToChangeInstallationDirectory: false
  runAfterFinish: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
