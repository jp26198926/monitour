# Monitour Nginx Configuration
# Place at /etc/nginx/sites-available/monitour and symlink to sites-enabled
# Usage: sudo ln -s /etc/nginx/sites-available/monitour /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name monitour.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS + WebSocket proxy to Monitour server
server {
    listen 443 ssl http2;
    server_name monitour.yourdomain.com;

    # --- TLS (Let's Encrypt or custom cert) ---
    ssl_certificate     /etc/letsencrypt/live/monitour.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitour.yourdomain.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # --- Static dashboard files ---
    location / {
        root /var/www/monitour/dashboard;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- API ---
    location /api/ {
        proxy_pass http://127.0.0.1:4430;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.IO (WebSocket) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4430;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
